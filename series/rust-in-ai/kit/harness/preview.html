<!doctype html><html><head><meta charset="utf-8"><title>kit preview</title>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#222}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(135deg,#3a3a3a,#1c1c1c)}
#stage>[data-composition-id]{position:absolute;inset:0}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script></head>
<body><div id="stage"></div>
<script>
// Dev harness: ?c=<composition path>&t=<seconds> shows one composition seeked to time t. Not used in AI Producer.
const q = new URLSearchParams(location.search);
window.__timelines = {};
fetch(q.get('c')).then(r => r.text()).then(src => {
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const node = document.importNode(doc.querySelector('template').content.firstElementChild, true);
  document.getElementById('stage').appendChild(node);
  const id = node.getAttribute('data-composition-id');
  node.querySelectorAll('script').forEach(s => { const n = document.createElement('script'); n.textContent = '(function(){' + s.textContent + '})();'; s.replaceWith(n); });
  const tl = window.__timelines[id]; tl.pause(); tl.time(parseFloat(q.get('t') || '0'), false);
  document.body.setAttribute('data-ready', '1');
});
</script></body></html>
